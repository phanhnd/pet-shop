<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="register.css">
</head>

<body>
    <div class="register">
        <div class="register-content">
            <h1>Register</h1>
            <button class="x-btn"><img src="img/login-x.png" alt=""></button>
            <form action="" class="register-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Username or email">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Password">
                </div>

                <div class="form-group">
                    <label for="repassword">Repassword</label>
                    <input type="password" placeholder="Repassword">
                </div>

                <p><em>The password should be at least eight characters long. To make it stronger, use upper and lower case letters, numbers, and symbols like ! " ? $ % ^ & )</em></p>

                <button type="submit" class="register-btn">Register</button>
            
            </form>

            <div class="social-login">
                <p>Login with social account ?</p>
                <div class="social-list">
                    <a href="#" class="social-icon">
                        <img src="img/gg-icon.png" alt="">
                    </a>
                    <a href="#" class="social-icon">
                        <img src="img/ig-icon.png" alt="">
                    </a>
                    <a href="#" class="social-icon">
                        <img src="img/f-icon.png" alt="">
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
