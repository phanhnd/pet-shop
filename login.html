<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="login">
        <div class="login-content">
            <h1>Login</h1>
            <button class="x-btn"><img src="img/login-x.png" alt=""></button>
            <form action="" class="login-form">
                <div class="form-group">
                    <label for="username">Username or email</label>
                    <input type="text" id="username" placeholder="Username or email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Password">
                </div>

                <div class="remember-lost">
                    <label for="" class="remember-me">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-password">Lost your password?</a>
                </div>

                <button type="submit" class="submit-btn">Log in</button>
            </form>

            <div class="social-login">
                <p>Login with social account ?</p>
                <div class="social-icon">
                    <a href="#" class="social-icon">
                        <img src="img/gg-icon.png" alt="">
                    </a>
                    <a href="#" class="social-icon" alt="">
                        <img src="img/ig-icon.png" alt="">
                    </a>
                    <a href="#" class="social-icon" alt="">
                        <img src="img/f-icon.png" alt="">
                    </a>
                </div>
            </div>

            <div class="signup-prompt">
                <span>Don't have an account ?</span>
                <a href="#" class="signup-link">Sign up</a>
            </div>
        </div>
    </div>
</body>

</html>
